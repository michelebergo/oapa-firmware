<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OAPA setup</title>
<style>
 /* Same mission-control look as the main page; system fonts only (no internet here). */
 body{font:14px/1.45 "Helvetica Neue",Arial,system-ui,sans-serif;margin:0;padding:20px 16px;background:#000;color:#f2f2f2}
 h1{font:900 22px "Helvetica Neue","Arial Black",Arial,sans-serif;text-transform:uppercase;letter-spacing:.2em;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid #262626}
 label{display:block;margin:16px 0 4px;font:700 10px "Helvetica Neue",Arial,sans-serif;color:#8b8b8b;text-transform:uppercase;letter-spacing:.22em}
 input{width:100%;padding:8px 0;font:600 16px "Helvetica Neue",Arial,sans-serif;box-sizing:border-box;background:transparent;color:#f2f2f2;border:0;border-bottom:1px solid #4a4a4a;border-radius:0;outline:none}
 input:focus{border-bottom-color:#fff}
 button{margin-top:22px;width:100%;padding:15px;font:800 12px "Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:.2em;background:#fff;color:#000;border:0;border-radius:0}
 button::after{content:"  \2192"} .note{color:#8b8b8b;font-size:13px} #msg{margin-top:16px;color:#8b8b8b}
</style></head><body>
<h1>OAPA setup</h1>
<p class="note">Enter the network your ASIAIR uses (its hotspot name is shown in the ASIAIR app). OAPA supports 2.4 GHz networks only.</p>
<form id="f">
 <label for="ssid">Network name (SSID)</label><input id="ssid" name="ssid" maxlength="32" required>
 <label for="password">Password</label><input id="password" name="password" type="password" maxlength="63">
 <button type="submit">Save and restart</button>
</form>
<p id="msg"></p>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const body = new URLSearchParams(new FormData(e.target));
  const r = await fetch('/api/wifi', {method: 'POST', body});
  msg.textContent = r.ok
    ? 'Saved. OAPA restarts and joins "' + body.get('ssid') + '". Connect your phone to that network and open http://oapa.local'
    : await r.text();
});
</script>
</body></html>
