[platformio]
default_envs = fysetc_e4

[env:fysetc_e4]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; two ~1.9 MB app slots: 1.2.2 is ~300 KB, WiFi + web brings it near 1 MB
board_build.partitions = min_spiffs.csv
build_unflags = -std=gnu++11
build_flags =
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    ; Arduino-core log_x() output goes to UART0, which belongs to N.I.N.A.
    -D CORE_DEBUG_LEVEL=0
    -std=gnu++17
extra_scripts = pre:tools/embed_web.py
lib_deps =
    teemuatlut/TMCStepper@^0.7.3
    waspinator/AccelStepper@^1.64
    esp32async/AsyncTCP@^3.5.0
    esp32async/ESPAsyncWebServer@^3.12.1

; Any ESP32 with plain STEP/DIR drivers (A4988, DRV8825, LV8729...): no TMC UART,
; current from the Vref trimmer, microsteps from the MS jumpers.
[env:esp32_stepdir]
extends = env:fysetc_e4
build_flags =
    ${env:fysetc_e4.build_flags}
    -D DRIVER_TMC2209=0
